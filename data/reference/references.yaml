# The reference registry: every source the simulator's claims cite, one entry per key.
# A claim cites keys (Factor.sources, Fault.sources, checks.yaml sources, the docs' [key] marks, references.CLAIMS).
# `verified` says how and when each entry was checked (DOI resolved, ISBN on the publisher's page, document text
# read). An entry without a DOI, ISBN or URL is not allowed (tests/test_references.py). Claims with no source stay
# labelled "assumed" rather than get a weak citation.
references:

  # --- liquid chromatography ---------------------------------------------------------------------------------
  - key: snyder_dolan_2007
    kind: book
    authors: Snyder LR, Dolan JW
    title: "High-Performance Gradient Elution: The Practical Application of the Linear-Solvent-Strength Model"
    source: Wiley-Interscience, Hoboken NJ
    year: 2007
    isbn: 978-0-471-70646-5
    verified: "2026-10-11: ISBN on the publisher's catalogue page"
    note: The LSS model, gradient retention and its closed form, dwell volume, gradient compression, the S ~ 0.25 MW^0.5 estimate.

  - key: snyder_kirkland_dolan_2010
    kind: book
    authors: Snyder LR, Kirkland JJ, Dolan JW
    title: Introduction to Modern Liquid Chromatography
    source: 3rd ed., Wiley, Hoboken NJ
    year: 2010
    isbn: 978-0-470-16754-0
    verified: "2026-10-11: ISBN on the publisher's catalogue page"
    note: Plate number and peak width, extra-column broadening, retention of ionisable compounds, reversed-phase retention and hydrophobicity.

  - key: horvath_1977
    kind: article
    authors: Horváth C, Melander W, Molnár I
    title: Liquid chromatography of ionogenic substances with nonpolar stationary phases
    source: Analytical Chemistry
    year: 1977
    volume: "49(1)"
    pages: 142-154
    doi: 10.1021/ac50009a044
    verified: "2026-10-11: DOI from Crossref"
    note: Retention of an acid or base as the ionisation-weighted sum of the neutral and ionised forms' retention.

  - key: dolan_2006_dwell
    kind: article
    authors: Dolan JW
    title: Dwell Volume Revisited
    source: LCGC North America, LC Troubleshooting column
    year: 2006
    url: https://www.chromatographyonline.com/view/dwell-volume-revisited-0
    verified: "2026-10-11: article page located; summary read through secondary sources"
    note: Dwell time = dwell volume / flow; peaks shift by the dwell-time difference between systems, early peaks less because they migrate during the isocratic hold.

  - key: dolan_2006_carryover
    kind: article
    authors: Dolan JW
    title: Autosampler Carryover
    source: LCGC North America 24(8), LC Troubleshooting column
